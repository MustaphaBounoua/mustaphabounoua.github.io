
          <div class="publications" data-selected-keys="{{ site.data.selected_papers | join: ',' }}">
            {%- comment %}
              Render selected publications. Show only the entries listed in _data/selected_papers.yml.
              Uses JavaScript to filter the bibliography list after rendering.
            {%- endcomment %}
            {% bibliography -f papers.bib -q @* %}
            <p class="small mt-1"><em>* means equal contribution</em></p>
          </div>
          <script>
            document.addEventListener('DOMContentLoaded', function() {
              const pubDiv = document.querySelector('.publications[data-selected-keys]');
              if (!pubDiv) return;
              const selectedKeys = pubDiv.getAttribute('data-selected-keys').split(',');
              const bibliographyItems = pubDiv.querySelectorAll('.bibliography > li');
              bibliographyItems.forEach(function(li) {
                const divId = li.querySelector('[id]');
                if (!divId || !selectedKeys.includes(divId.id)) {
                  li.style.display = 'none';
                }
              });
            });
          </script>
